# Render.com configuration for Queen Style
# This file defines services for Render deployment

services:
  # Backend API Service
  - type: web
    name: queen-style-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard
      - key: SESSION_SECRET
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        sync: false  # Set this after frontend is deployed
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Service
  - type: web
    name: queen-style-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set this to backend URL after deployment
    autoDeploy: true

